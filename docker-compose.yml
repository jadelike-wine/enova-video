name: agnes-ai-creator

services:
  backend:
    build:
      context: ./backend
    image: agnes-ai-creator/backend
    # 仅对 frontend 开放 8000，不对外网暴露（生产安全）
    expose:
      - "8000"
    environment:
      # SQLite 持久化到 /data（named volume）
      DATABASE_PATH: /data/app.db
      # 存储 Provider: none | qiniu | s3
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-none}
      # AWS S3（凭据可选，EC2/ECS/EKS 可用 IAM Role，无需写入密钥）
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_PREFIX: ${AWS_S3_PREFIX:-agnes-ai}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_S3_PUBLIC_BASE_URL: ${AWS_S3_PUBLIC_BASE_URL:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      # 可选：七牛云对象存储（不配置则跳过转存）
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET: ${QINIU_BUCKET:-}
      QINIU_DOMAIN: ${QINIU_DOMAIN:-}
      QINIU_REGION: ${QINIU_REGION:-z0}
      # 可选：数据库为空时，用该 Key 作为初始 API Key 导入（也可在网页设置中添加）
      AGNES_API_KEY: ${AGNES_API_KEY:-}
      # 可选：Agnes Base URL 初始值（默认 apihub.agnes-ai.com）
      AGNES_BASE_URL: ${AGNES_BASE_URL:-}
      # ---- 日志 ----
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_PROMPTS: ${LOG_PROMPTS:-false}
      ACCESS_LOG: ${ACCESS_LOG:-true}
    # 日志滚动：20MB × 5 个文件/容器，防止详细日志无限吃满磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    volumes:
      - backend_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # /api/* rewrite 在构建期生效，指向 Compose 内部服务名 backend
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
        # 站点对外公开 URL（SEO canonical/OG，非密钥，构建期内联）
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: agnes-ai-creator/frontend
    # 对外暴露 3000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    # 日志滚动：20MB × 5 个文件/容器
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

volumes:
  backend_data: