name: Deploy / Rollback (Production)

# 仅手动触发（workflow_dispatch），禁止 push main 自动部署生产。
# 通过 SSH 调用服务器上已有的 scripts/update.sh 或 scripts/rollback.sh。
# GitHub Action 不覆盖服务器 .env，不传递任何 Agnes/AWS/Qiniu Secret。
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy 或 rollback'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      version:
        description: '目标版本（如 v1.2.0）；deploy 时生效，留空则升级到最新 stable'
        required: false
        default: ''
        type: string
      restore_db:
        description: 'rollback 是否恢复旧数据库（有数据丢失风险），仅在 rollback 时生效'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  execute:
    name: ${{ inputs.action }} on production
    runs-on: ubuntu-latest
    # environment 必须放在 job 内（GitHub Actions 中它是 job 级关键字）。
    # 放在 workflow 顶层会导致工作流无法正确解析而出现 "No jobs were run"。
    # 生产环境：建议在 GitHub Settings -> Environments -> production
    # 配置 Required Reviewers（人工批准后才允许部署）。
    # 该 job 可访问 Repository Secrets 与 production Environment Secrets。
    environment: production
    steps:
      - name: Deploy via SSH
        if: inputs.action == 'deploy'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # envs 告诉 ssh-action 把哪些环境变量转发到远程 shell；
          # 值来自下方 env: 块。没有 envs 远程脚本里 $DEPLOY_PATH 会是空值。
          envs: DEPLOY_PATH,DEPLOY_VERSION
          script: |
            set -e
            cd "$DEPLOY_PATH"
            if [ -n "$DEPLOY_VERSION" ]; then
              ./scripts/update.sh "$DEPLOY_VERSION"
            else
              ./scripts/update.sh
            fi
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_VERSION: ${{ inputs.version }}

      - name: Rollback via SSH
        if: inputs.action == 'rollback'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH,DEPLOY_RESTORE_DB
          script: |
            set -e
            cd "$DEPLOY_PATH"
            if [ "$DEPLOY_RESTORE_DB" = "true" ]; then
              # restore_db 由用户在 workflow_dispatch 中显式选择后才执行；
              # AUTO_CONFIRM=1 跳过 rollback.sh 的交互式确认，避免 GitHub Action 卡住。
              AUTO_CONFIRM=1 ./scripts/rollback.sh --restore-db
            else
              ./scripts/rollback.sh --code-only
            fi
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_RESTORE_DB: ${{ inputs.restore_db }}

      - name: Pull deploy-tool & restart API with update override
        if: success() && inputs.action == 'deploy'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"
            APP_VERSION=$(cat VERSION)
            echo "Pulling deploy-tool: ${APP_VERSION}"
            docker pull "ghcr.io/jadelike-wine/enova-video-deploy-tool:${APP_VERSION}"
            echo "Restarting API with update override"
            docker compose -f docker-compose.prod.yml -f docker-compose.update.yml up -d api
            echo "System update ready"
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

      - name: Mark failed on failed deploy
        if: failure()
        run: echo "::error::Deploy/Rollback 未成功，目标版本部署失败或回滚异常。请查看服务器 .deploy/logs/ 与服务器返回日志。"