name: CI

# CI 只做校验，绝不自动部署生产。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monorepo-test:
    name: Monorepo (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Enable pnpm & install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  docker-compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate dev compose
        run: docker compose config -q
      - name: Validate prod compose
        run: |
          mkdir -p .deploy
          echo "APP_VERSION=1.0.0" > .deploy/version.env
          docker compose -f docker-compose.prod.yml --env-file .deploy/version.env config -q