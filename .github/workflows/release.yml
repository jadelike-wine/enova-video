name: Release

# 推送 v* tag 时构建并发布 GHCR 镜像 + GitHub Release。
# 只发布镜像，绝不自动部署生产服务器。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}   # ghcr.io/jadelike-wine/enova-video

jobs:
  # 发布前必须通过测试：后端 compile+unittest、前端 lint+build。
  # 测试失败则整个 workflow 失败，禁止构建/推送镜像与发布 Release。
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Backend compile + unittest
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -m compileall -q app
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend lint + build
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
          BACKEND_URL: http://backend:8000

      # 防回归：HTML 200 但 CSS/JS 404 的生产问题。Next.js 15.5.x 嵌套 layout
      # 曾导致全局 CSS 被静默丢弃（构建成功但 .next/static/css 为空）。
      # 此处强制校验构建产物确实生成了 CSS/JS 静态文件，缺失即失败。
      - name: Check static CSS/JS artifacts
        working-directory: frontend
        run: |
          css_count=$(find .next/static/css -name "*.css" 2>/dev/null | wc -l | tr -d ' ')
          js_count=$(find .next/static/chunks -name "*.js" 2>/dev/null | wc -l | tr -d ' ')
          echo "CSS files: $css_count"
          echo "JS files: $js_count"
          if [ "$css_count" -eq 0 ]; then
            echo "::error::Build output has NO CSS files (missing or empty .next/static/css). Global styles were silently dropped. Aborting release."
            exit 1
          fi
          if [ "$js_count" -eq 0 ]; then
            echo "::error::Build output has NO JS chunks (.next/static/chunks empty). Aborting release."
            exit 1
          fi

  release:
    name: Build & Publish ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 提取 SemVer（去掉 v 前缀）与 Git SHA
      - name: Prepare version metadata
        id: meta
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- Backend ----
      - name: Build & push backend
        id: build-backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}-backend:latest
            ${{ env.IMAGE_BASE }}-backend:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      # ---- Frontend ----
      - name: Build & push frontend
        id: build-frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}-frontend:latest
            ${{ env.IMAGE_BASE }}-frontend:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
            BACKEND_URL=http://backend:8000

      # ---- Release Manifest（release.json）----
      - name: Build release.json
        id: manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          DIGEST_BACKEND: ${{ steps.build-backend.outputs.digest }}
          DIGEST_FRONTEND: ${{ steps.build-frontend.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          base = os.environ["IMAGE_BASE"]
          ver = os.environ["VERSION"]
          digest_backend = os.environ["DIGEST_BACKEND"]
          digest_frontend = os.environ["DIGEST_FRONTEND"]
          manifest = {
              "version": f"{ver}",
              "git_sha": os.environ["GIT_SHA"],
              "frontend_image": f"{base}-frontend:{ver}",
              "backend_image": f"{base}-backend:{ver}",
              "frontend_digest": digest_frontend,
              "backend_digest": digest_backend,
              "published_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }
          with open("release.json", "w") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(os.path.abspath("release.json"))
          PY

      - name: Upload release.json artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-manifest
          path: release.json

      # ---- GitHub Release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.meta.outputs.version }}
          body: |
            ## Enova Video v${{ steps.meta.outputs.version }}

            - **Version**: v${{ steps.meta.outputs.version }}
            - **Git SHA**: `${{ steps.meta.outputs.git_sha }}`
            - **Build Time**: ${{ steps.meta.outputs.build_time }}

            ### Docker Images
            - `${{ env.IMAGE_BASE }}-frontend:${{ steps.meta.outputs.version }}`
            - `${{ env.IMAGE_BASE }}-backend:${{ steps.meta.outputs.version }}`

            ### Image Digests
            backend: `${{ steps.build-backend.outputs.digest }}`
            frontend: `${{ steps.build-frontend.outputs.digest }}`

            ### Upgrade
            ```bash
            ./scripts/update.sh v${{ steps.meta.outputs.version }}
            ```
          files: release.json
          generate_release_notes: true
          draft: false
          prerelease: false