name: CI

# CI 只做校验，绝不自动部署生产。
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monorepo-test:
    name: Monorepo (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # 全新 checkout 后 @enova/contracts 等 workspace 包尚未构建（dist 不存在），
      # 需先构建 packages 供 typecheck / test 解析类型与源码引用。
      # 注意：不能跑全量 pnpm build（apps/web 需要 BACKEND_URL 等，CI 未设置会失败）；
      # 这里只构建纯 TS packages，typecheck/test 针对所有 workspace 全量执行。
      - name: Build packages
        run: pnpm -r --filter './packages/*' build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  docker-compose-config:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config -q
      - name: Validate prod compose
        run: |
          mkdir -p .deploy
          cat > .deploy/version.env <<'EOF'
          APP_VERSION=1.0.0
          POSTGRES_PASSWORD=test-password-for-ci-validation
          REDIS_PASSWORD=test-redis-password
          CREDENTIAL_MASTER_KEY=test-32-byte-key-for-production-use-only
          SUPPORT_EMAIL=support@example.com
          STORAGE_PROVIDER=aws_s3
          AWS_REGION=us-east-1
          AWS_S3_BUCKET=test-bucket
          PAYMENT_MODE=alipay
          PAYMENT_RETURN_BASE_URL=http://example.com
          PAYMENT_NOTIFY_URL=http://example.com/notify
          SMTP_HOST=smtp.example.com
          SMTP_USER=test@example.com
          SMTP_PASSWORD=test-smtp-password
          SMTP_FROM_EMAIL=test@example.com
          APP_PASSWORD_RESET_URL=http://localhost:3000/auth/reset-password
          APP_EMAIL_VERIFY_URL=http://localhost:3000/auth/verify-email
          APP_SITE_URL=http://localhost:3000
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          NEXT_PUBLIC_SITE_URL=http://localhost:3000
          EOF
          docker compose -f docker-compose.prod.yml --env-file .deploy/version.env config -q
