name: Release

# 推送 v* tag 时构建并发布 GHCR 镜像（新架构：api / worker / web）+ GitHub Release。
# 只发布镜像，绝不自动部署生产服务器。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}   # ghcr.io/jadelike-wine/enova-video

jobs:
  # 发布前必须通过测试：新架构 monorepo 的 lint + typecheck + unit test。
  # 测试失败则整个 workflow 失败，禁止构建/推送镜像与发布 Release。
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全新 checkout 后 @enova/contracts 等 workspace 包尚未构建（dist 不存在），
      # 需先构建 packages 供 typecheck / test 解析类型与源码引用。
      # 注意：不能跑全量 pnpm build（apps/web 需要 NEXT_PUBLIC_SITE_URL，此处未设置会失败）；
      # 这里只构建纯 TS packages，typecheck/test 针对所有 workspace 全量执行。
      - name: Build packages
        run: pnpm -r --filter './packages/*' build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  release:
    name: Build & Publish ${{ github.ref_name }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 提取 SemVer（去掉 v 前缀）与 Git SHA
      - name: Prepare version metadata
        id: meta
        run: |
          RAW_VERSION="${{ github.ref_name }}"
          VERSION="${RAW_VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "git_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---- API ----
      - name: Build & push api
        id: build-api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-api:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-api:buildcache,mode=max
          tags: |
            ${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}-api:latest
            ${{ env.IMAGE_BASE }}-api:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      # ---- Deploy tool（供 API 通过 docker.sock 执行 update.sh/rollback.sh）----
      - name: Build & push deploy-tool
        id: build-deploy-tool
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: deploy-tool
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-deploy-tool:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-deploy-tool:buildcache,mode=max
          tags: |
            ${{ env.IMAGE_BASE }}-deploy-tool:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}-deploy-tool:latest
            ${{ env.IMAGE_BASE }}-deploy-tool:sha-${{ github.sha }}

      # ---- Worker ----
      - name: Build & push worker
        id: build-worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: worker
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-worker:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-worker:buildcache,mode=max
          tags: |
            ${{ env.IMAGE_BASE }}-worker:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}-worker:latest
            ${{ env.IMAGE_BASE }}-worker:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      # ---- Web ----
      - name: Build & push web
        id: build-web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          platforms: linux/amd64
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}-web:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}-web:buildcache,mode=max
          tags: |
            ${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_BASE }}-web:latest
            ${{ env.IMAGE_BASE }}-web:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.com' }}
            BACKEND_URL=http://api:3001

      # ---- Release Manifest（release.json）----
      - name: Build release.json
        id: manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          DIGEST_API: ${{ steps.build-api.outputs.digest }}
          DIGEST_DEPLOY_TOOL: ${{ steps.build-deploy-tool.outputs.digest }}
          DIGEST_WORKER: ${{ steps.build-worker.outputs.digest }}
          DIGEST_WEB: ${{ steps.build-web.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          base = os.environ["IMAGE_BASE"]
          ver = os.environ["VERSION"]
          manifest = {
              "version": f"{ver}",
              "git_sha": os.environ["GIT_SHA"],
              "api_image": f"{base}-api:{ver}",
              "deploy_tool_image": f"{base}-deploy-tool:{ver}",
              "worker_image": f"{base}-worker:{ver}",
              "web_image": f"{base}-web:{ver}",
              "api_digest": os.environ["DIGEST_API"],
              "deploy_tool_digest": os.environ["DIGEST_DEPLOY_TOOL"],
              "worker_digest": os.environ["DIGEST_WORKER"],
              "web_digest": os.environ["DIGEST_WEB"],
              "published_at": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
          }
          with open("release.json", "w") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          print(os.path.abspath("release.json"))
          PY

      - name: Upload release.json artifact
        uses: actions/upload-artifact@v5
        with:
          name: release-manifest
          path: release.json

      # ---- GitHub Release ----
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.meta.outputs.version }}
          body: |
            ## Enova Video v${{ steps.meta.outputs.version }}

            - **Version**: v${{ steps.meta.outputs.version }}
            - **Git SHA**: `${{ steps.meta.outputs.git_sha }}`
            - **Build Time**: ${{ steps.meta.outputs.build_time }}

            ### Docker Images
            - `${{ env.IMAGE_BASE }}-api:${{ steps.meta.outputs.version }}`
            - `${{ env.IMAGE_BASE }}-deploy-tool:${{ steps.meta.outputs.version }}`
            - `${{ env.IMAGE_BASE }}-worker:${{ steps.meta.outputs.version }}`
            - `${{ env.IMAGE_BASE }}-web:${{ steps.meta.outputs.version }}`

            ### Image Digests
            api: `${{ steps.build-api.outputs.digest }}`
            deploy-tool: `${{ steps.build-deploy-tool.outputs.digest }}`
            worker: `${{ steps.build-worker.outputs.digest }}`
            web: `${{ steps.build-web.outputs.digest }}`

            ### Upgrade
            ```bash
            ./scripts/update.sh v${{ steps.meta.outputs.version }}
            ```
          files: release.json
          generate_release_notes: true
          draft: false
          prerelease: false
